name: Update public paper pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'research.html'
      - 'publications.html'
      - 'preprints.html'
      - 'ai-aided-papers.html'
      - 'teaching.html'
      - 'contact.html'
      - 'ai-papers/**'
      - 'script.js'
      - 'paper-filters.js'
      - 'publication-atlas.js'
      - 'publication-atlas.css'
      - 'maintain_public_site.py'
      - 'update_page_presentation.py'
      - '.github/workflows/update-public-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-public-paper-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify website scripts
        run: |
          python3 -m py_compile maintain_public_site.py update_page_presentation.py
          node --check publication-atlas.js
          node --check paper-filters.js
      - name: Maintain separate pages and public AI-paper links
        run: python3 maintain_public_site.py
      - name: Number papers in descending order and expand homepage information
        run: python3 update_page_presentation.py
      - name: Commit only the updated public pages
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          for page in index.html research.html publications.html preprints.html ai-aided-papers.html teaching.html contact.html; do
            if [ -f "$page" ]; then
              git add -- "$page"
            fi
          done
          if git diff --cached --quiet; then
            echo 'updated=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public pages, descending paper counts, and expanded homepage'
          git push origin HEAD:main
          echo 'updated=true' >> "$GITHUB_OUTPUT"
      - name: Request publication of the updated pages
        if: steps.commit.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
